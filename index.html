<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Austeridade · Diretoria SPI</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#F1F3F6;--panel:#fff;--alt:#F8F9FA;--line:#E2E5E9;--soft:#ECEEF1;--ink:#1F242D;--dim:#646D7A;--green:#006B3F;--ok:#137333;--warn:#B06000;--crit:#C5221F;
--font:'Averta Demo','IBM Plex Sans',sans-serif;--bold:'Averta-Bold','Averta Demo','IBM Plex Sans',sans-serif;--black:'Averta-Black','Averta Demo','IBM Plex Sans',sans-serif;--mono:'IBM Plex Mono',monospace}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
.shell{max-width:1320px;margin:0 auto;padding:24px 24px 60px}
.titleblock,.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.titleblock{display:flex;justify-content:space-between;align-items:flex-end;padding:20px 24px;gap:24px;flex-wrap:wrap;margin-bottom:16px}
.tb-name{font-family:var(--black);font-weight:900;font-size:24px;color:#FF8B22}
.tb-meta{font-family:var(--mono);font-size:12px;color:var(--dim);background:var(--alt);padding:6px 10px;border-radius:6px;border:1px solid var(--soft)}
.panel{padding:22px 24px;margin-bottom:16px}
.panel h2{font-family:var(--bold);font-size:15px;margin:0 0 14px}
.tabs-nav{display:flex;gap:8px;margin-bottom:16px}
.tab-btn{font-family:var(--bold);font-weight:700;background:#E5E8ED;border:1px solid var(--line);border-bottom:none;border-radius:8px 8px 0 0;padding:10px 22px;font-size:13.5px;cursor:pointer;color:var(--dim)}
.tab-btn.active{background:var(--panel);color:var(--green)}
.tab-content{display:none}.tab-content.active{display:block}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.filters label{font-family:var(--bold);font-size:11.5px;color:var(--dim)}
select,input[type=text]{background:var(--panel);border:1px solid var(--line);border-radius:6px;color:var(--ink);padding:8px 12px;font-family:var(--font);font-size:12.3px}
input[type=text]{min-width:240px}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:6px;font-size:11.5px;padding:6px 12px;cursor:pointer}.btn:hover{border-color:var(--green);color:var(--green)}
.kpi-row{display:grid;grid-template-columns:repeat(7,1fr);gap:12px;margin-bottom:16px}
@media(max-width:1100px){.kpi-row{grid-template-columns:repeat(4,1fr)}}@media(max-width:700px){.kpi-row{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--green);border-radius:8px;padding:14px 16px;color:#fff}
.kpi .label{font-family:var(--bold);font-weight:700;font-size:11px;white-space:nowrap}
.kpi .value{font-family:var(--black);font-weight:900;font-size:17px;margin-top:6px}
.table-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.8px}
thead th{font-family:var(--bold);text-align:right;font-weight:700;font-size:11.5px;color:#fff;background:var(--green);padding:10px 12px;white-space:nowrap}
th.left,td.left{text-align:left}
tbody td{padding:7px 12px;border-bottom:1px solid var(--soft);text-align:right;font-family:var(--mono);font-size:12.3px;white-space:nowrap}
td.left{font-family:var(--font)}
tbody tr:hover{background:#F0F4F8}
tr.l0{background:#F4F7F5;font-weight:600}tr.l2{font-size:12px;color:#444}tr.tg{cursor:pointer}
tr.tot{background:#E6EFEA;font-weight:700}
.tt{display:inline-block;width:18px;font-weight:bold;color:var(--green);text-align:center}
.neg{color:var(--crit)}.pos{color:var(--ok)}
.fd{display:inline-block;width:12px;height:12px;border-radius:50%}
.f-r{background:#C5221F}.f-y{background:#F2B01E}.f-g{background:#1E9E5A}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:10px;font-family:var(--mono);font-size:11.5px;color:var(--dim)}
.note{font-size:11.5px;color:var(--dim);margin-top:10px}
#dashboard,#fallback{display:none}#dashboard.visible,#fallback.visible{display:block}
.lg{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;margin-top:8px;font-size:12px;color:var(--dim)}
.lg span{display:inline-flex;align-items:center;gap:6px}
.lg i{display:inline-block}.lg .sq{width:12px;height:12px;border-radius:2px}.lg .ln{width:24px;height:0;border-top:2.5px solid #5F6368}.lg .ds{border-top-style:dashed;border-color:#9AA0A6}
.ms{position:relative;display:inline-block}
.msb{background:var(--panel);border:1px solid var(--line);border-radius:6px;color:var(--ink);padding:8px 12px;font-family:var(--font);font-size:12.3px;cursor:pointer}
.msp{position:absolute;z-index:30;top:calc(100% + 4px);left:0;background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 14px;box-shadow:0 6px 18px rgba(0,0,0,.12);display:flex;flex-direction:column;gap:7px;min-width:210px}
.msp label{display:flex;gap:8px;align-items:center;font-size:12.3px;cursor:pointer;color:var(--ink);font-family:var(--font)}
.msp a{font-size:11.5px;color:var(--green);cursor:pointer;margin-top:2px}
</style>
</head>
<body>
<div class="shell">
  <div class="titleblock">
    <div class="tb-name">Painel de Austeridade · Diretoria SPI</div>
    <div class="tb-meta" id="tbMeta">Conectando ao GitHub...</div>
  </div>

  <div class="panel" id="fallback">
    <h2>Não foi possível carregar do GitHub</h2>
    <p id="fbMsg" class="note"></p>
    <p>Selecione manualmente os 3 arquivos (Base Real x Orçado, Parametro Austeridade e VGV Austeridade):</p>
    <input type="file" id="fbFiles" multiple accept=".xlsx,.xlsm">
  </div>

  <div id="dashboard">

    <div class="tabs-nav">
      <button class="tab-btn active" data-tab="p-mes">Fechado no mês</button>
      <button class="tab-btn" data-tab="p-acum">Acumulado</button>
      <button class="tab-btn" data-tab="p-graf">Gráficos</button>
    </div>
    <div id="p-mes" class="tab-content active"></div>
    <div id="p-acum" class="tab-content"></div>
    <div id="p-graf" class="tab-content"></div>
  </div>
</div>

<script>
/* ===== Configuração do GitHub (ajuste usuário/repositório/nomes dos arquivos) ===== */
const GH={user:"SPIPerformance",repo:"austeridadespi",branch:"main"};
const FILES={ro:"Base Real x Orçado - Desdobrado em Centro de Custo e Conta Contábil.xlsx",par:"Parametro Austeridade.xlsx",vgv:"VGV Austeridade.xlsx"};
const url=f=>`https://raw.githubusercontent.com/${GH.user}/${GH.repo}/${GH.branch}/${encodeURIComponent(f)}?t=${Date.now()}`;

const MESES=['JANEIRO','FEVEREIRO','MARÇO','ABRIL','MAIO','JUNHO','JULHO','AGOSTO','SETEMBRO','OUTUBRO','NOVEMBRO','DEZEMBRO'];
const COMIS='COMISSÕES E PREMIAÇÕES (CONTRATADA)';
const S={rg1:'',rg2:'',ro:[],vgv:{},gst:{},loja:{},mes:1,reg:'',exp:new Set(),page:1};
const $=id=>document.getElementById(id);
const up=s=>String(s==null?'':s).trim();
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fmt=n=>Math.round(n).toLocaleString('pt-BR');
const pct=(n,d=1)=>n==null||!isFinite(n)?'-':(n*100).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d})+'%';
const rd=(wb,opt)=>XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],Object.assign({header:1,defval:null},opt||{}));
const mergeSensia=r=>(r==='SENSIA CP'||r==='SENSIA RP')?'SENSIA':r;

/* ===== Leitura das bases ===== */
function parseParam(wb){
  const rows=rd(wb),h0=(rows[0]||[]).map(up),h1=(rows[1]||[]).map(up);
  const cG=h0.indexOf('GST')>=0?h0.indexOf('GST'):27,cR=h0.indexOf('regional')>=0?h0.indexOf('regional'):26;
  const cC=h1.indexOf('NOME CC')>=0?h1.indexOf('NOME CC'):14,cL=h1.indexOf('NOME LOJA')>=0?h1.indexOf('NOME LOJA'):15;
  S.gst={};S.loja={};
  rows.forEach((r,i)=>{if(!r)return;
    if(i>=1&&r[cG]&&r[cR])S.gst[up(r[cG])]=up(r[cR]);
    if(i>=2&&r[cC]&&r[cL])S.loja[up(r[cC])]=up(r[cL]);});
}
function parseVGV(wb){
  /* Reproduz a aba VGV: META = SUMIFS(orçvgv!C; orçvgv!B=regional; orçvgv!D=mês) · REAL = SUMIFS(det_prop vgv!C; A=regional; mês)
     SENSIA = CP + RP · (Tudo) = soma das regionais · YTD/Mês atual = soma dos meses (ver vgvFor) */
  const sh=re=>{const n=wb.SheetNames.find(x=>re.test(x.toLowerCase()));if(!n)throw new Error('Aba não encontrada na base VGV: '+re);return XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:null});};
  const MA=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'],out={};
  const add=(reg,m,k,v)=>{if(!reg||!(m>=1&&m<=12))return;const o=out[reg]||(out[reg]={m:{},r:{}});o[k][m]=(o[k][m]||0)+(Number(v)||0);};
  const A=sh(/or[çc]vgv/),hA=(A[0]||[]).map(up),ix=(n,d)=>hA.indexOf(n)>=0?hA.indexOf(n):d;
  const cB=ix('Regional Comercial',1),cC=ix('VGV Orçado',2),cD=ix('Datanum',3);
  for(let i=1;i<A.length;i++){const r=A[i];if(r&&r[cB])add(up(r[cB]),Number(r[cD]),'m',r[cC]);}
  const B=sh(/det_prop/),hi=B.findIndex(r=>r&&up(r[0])==='RegionalComercial');
  for(let i=hi+1;i<B.length;i++){const r=B[i];if(!r||!r[0]||up(r[0])==='Total Geral')continue;
    let m=MA.indexOf(up(r[1]).toLowerCase().slice(0,3))+1;if(!m)m=Number(r[3]);
    add(up(r[0]),m,'r',r[2]);}
  const base=Object.keys(out).filter(n=>n!=='SENSIA'&&n!=='(Tudo)');
  const mk=n=>out[n]||(out[n]={m:{},r:{}}),SE=mk('SENSIA'),TT=mk('(Tudo)');
  base.forEach(n=>['m','r'].forEach(k=>{for(let m=1;m<=12;m++){const v=out[n][k][m]||0;TT[k][m]=(TT[k][m]||0)+v;
    if(n==='SENSIA CP'||n==='SENSIA RP')SE[k][m]=(SE[k][m]||0)+v;}}));
  S.vgv=out;
  S.vgvMax=0;for(let m=1;m<=12;m++)if(TT.r[m]>0)S.vgvMax=m;   // último mês com VGV Real
}
function parseBase(wb){
  const rows=rd(wb),hi=rows.findIndex(r=>r&&r.includes('Gestão'));
  if(hi<0)throw new Error('Cabeçalho "Gestão" não encontrado na base.');
  const H=rows[hi].map(up),c=n=>H.indexOf(n);
  const cr=H.findIndex(h=>/^Real\s*\d+/.test(h)),co=H.findIndex(h=>/^Or[çc]\s*\d+/.test(h));
  const out=[];
  for(let i=hi+1;i<rows.length;i++){
    const x=rows[i];if(!x)continue;
    const m=Number(x[c('Mês')]),g=up(x[c('Gestão')]);
    if(!g||!(m>=1&&m<=12))continue;           // descarta linhas de total/filtros do export
    const pac=up(x[c('Pacote')]),cc=up(x[c('Centro de custo')]);
    const o={mes:m,ges:g,raw:S.gst[g]||'(Sem regional)',reg:mergeSensia(S.gst[g]||'(Sem regional)'),pac,sub:up(x[c('Subpacote')]),cc,conta:up(x[c('Conta')]),cod:up(x[c('Cod. conta')]),
      real:Number(x[cr])||0,com:pac.toUpperCase()===COMIS};
    {o.orc=Number(x[co])||0;o.loja=pac==='PLANTÕES E LOJAS'?(S.loja[cc.toUpperCase()]||cc):'';}
    out.push(o);}
  return out;
}

/* ===== Carga ===== */
async function load(){
  try{
    const keys=Object.keys(FILES);
    let res=await Promise.all(keys.map(k=>fetch(url(FILES[k])).catch(()=>({ok:false,status:'rede'}))));
    if(res.some(r=>!r.ok)){
      // Nome diferente no repositório: lista a pasta via API do GitHub e acha cada arquivo pelo nome
      const PAT={ro:/or[çc]ado/i,par:/param/i,vgv:/vgv/i};
      const falhas=keys.filter((k,i)=>!res[i].ok).map(k=>decodeURIComponent(url(FILES[k]).split('?')[0]));
      let list=null;
      try{const a=await fetch(`https://api.github.com/repos/${GH.user}/${GH.repo}/contents/?ref=${GH.branch}`);
        if(a.ok)list=(await a.json()).filter(f=>f.type==='file');}catch(_){}
      if(!list){try{const j=await fetch(`https://data.jsdelivr.com/v1/packages/gh/${GH.user}/${GH.repo}@${GH.branch}?structure=flat`);
        if(j.ok)list=(await j.json()).files.filter(f=>f.name.split('/').length===2).map(f=>{const n=f.name.slice(1);return{name:n,download_url:`https://raw.githubusercontent.com/${GH.user}/${GH.repo}/${GH.branch}/${encodeURIComponent(n)}`};});}catch(_){}}
      if(!list)throw new Error(`Não consegui ler o repositório ${GH.user}/${GH.repo} (branch ${GH.branch}). Endereços que deram erro: ${falhas.join(' | ')}`);
      list=list.filter(f=>/\.xls[xm]$/i.test(f.name));
      const found={ro:list.find(f=>PAT.ro.test(f.name)),par:list.find(f=>PAT.par.test(f.name)),vgv:list.find(f=>PAT.vgv.test(f.name))};
      const miss=keys.filter(k=>!found[k]).map(k=>FILES[k]);
      if(miss.length)throw new Error(`Não encontrei no repositório: ${miss.join(' | ')}. Arquivos vistos: ${list.map(f=>f.name).join(' | ')||'(nenhum .xlsx na raiz)'}`);
      res=await Promise.all(keys.map(k=>fetch(found[k].download_url+'?t='+Date.now())));
      res.forEach((r,i)=>{if(!r.ok)throw new Error(`Erro ao baixar ${found[keys[i]].name} (${r.status})`);});
    }
    const b=await Promise.all(res.map(r=>r.arrayBuffer()));
    ingest({ro:b[0],par:b[1],vgv:b[2]});
  }catch(e){console.error(e);$('tbMeta').textContent='Falha ao conectar ao GitHub';$('fbMsg').textContent=String(e.message||e);$('fallback').classList.add('visible');}
}
/* ===== Filtros por bloco (multisseleção de regionais) ===== */
const F={},SEN=['SENSIA CP','SENSIA RP'];
const fget=id=>F[id]||(F[id]={mes:S.mes,regs:new Set(),open:false});
const REGS=()=>[...new Set(S.ro.map(r=>r.raw))].sort();
const inSet=regs=>r=>!regs.size||regs.has(r.raw);
const bothSen=regs=>regs.has(SEN[0])&&regs.has(SEN[1]);
const regKey=(r,regs)=>SEN.includes(r.raw)&&(!regs.size||bothSen(regs))?'SENSIA':r.raw;   // CP + RP selecionadas (ou Todas) = SENSIA
function regLabel(regs){
  if(!regs.size)return'Todas';
  const l=[...regs].filter(x=>!(bothSen(regs)&&SEN.includes(x))).sort();
  if(bothSen(regs))l.unshift('SENSIA');
  return l.length>2?`${l[0]}, ${l[1]} +${l.length-2}`:l.join(', ');
}
function msel(id){
  const f=fget(id);
  return`<span class="ms"><button class="msb" data-ms="${id}">Regional: <b>${esc(regLabel(f.regs))}</b> ▾</button>${f.open?`<div class="msp">${REGS().map(r=>`<label><input type="checkbox" data-id="${id}" data-reg="${esc(r)}"${f.regs.has(r)?' checked':''}> ${esc(r)}</label>`).join('')}<div class="note" style="margin:0">CP + RP marcadas = SENSIA</div><a data-clear="${id}">Limpar seleção</a></div>`:''}</span>`;
}
const bar=id=>{const f=fget(id);return`<div class="filters" style="margin-bottom:12px"><label>Mês</label><select data-fm="${id}">${MESES.map((n,i)=>`<option value="${i+1}"${f.mes===i+1?' selected':''}>${n}</option>`).join('')}</select>${msel(id)}</div>`;};
function ingest(b){
  const R=(buf,opt)=>XLSX.read(buf,Object.assign({type:'array'},opt||{}));
  parseParam(R(b.par,{sheetRows:600}));
  parseVGV(R(b.vgv));
  S.ro=parseBase(R(b.ro));
  const ms=[...new Set(S.ro.filter(r=>r.real).map(r=>r.mes))];
  S.mes=ms.length?Math.max(...ms):1;
  if(S.vgvMax&&S.mes>S.vgvMax)S.mes=S.vgvMax;   // padrão: último mês com despesa E VGV Real
  $('tbMeta').innerHTML=`Dados até <b>${MESES[S.mes-1]}</b> · Atualizado: <b>${new Date().toLocaleString('pt-BR')}</b>`;
  $('fallback').classList.remove('visible');$('dashboard').classList.add('visible');
  renderAll();
}

/* ===== Cálculo: VGV e razões ===== */
function vgvFor(regs,ms){
  const V=S.vgv,names=(regs&&regs.size)?[...regs].filter(n=>V[n]):Object.keys(V).filter(n=>n!=='(Tudo)'&&n!=='SENSIA');
  if(!names.length)return null;                         // ex.: DIRETORIA SPI não tem VGV
  let M=0,R=0;names.forEach(n=>ms.forEach(m=>{M+=V[n].m[m]||0;R+=V[n].r[m]||0;}));
  return{M,R};
}
const msOf=(mode,m)=>mode==='mes'?[m]:Array.from({length:m},(_,i)=>i+1);
/* ORÇ.%VGV = (Meta - Meta Comissões)/VGV Meta + Meta Comissões/VGV Real ; REAL.%VGV = Real/VGV Real
   (equivale às fórmulas PROCX: comissões contratadas usam VGV Real nas duas pontas) */
function ratios(n,v){
  if(!v)return[null,null];
  const a=n.meta-n.com,b=n.com;
  const o=((a&&!v.M)||(b&&!v.R))?null:(a?a/v.M:0)+(b?b/v.R:0);
  return[o,v.R?n.real/v.R:null];
}
const farol=d=>{if(d==null)return'-';const x=Math.round(d*1e4)/1e4;return`<span class="fd ${x>=0.01?'f-r':x>0?'f-y':'f-g'}"></span>`;};
function sum(rows,k){const n={k:k||'',meta:0,real:0,com:0,rows};rows.forEach(r=>{n.meta+=r.orc;n.real+=r.real;if(r.com)n.com+=r.orc;});return n;}
function build(rows,fn){
  const g=new Map();
  rows.forEach(r=>{const k=fn(r);if(!g.has(k))g.set(k,{k,meta:0,real:0,com:0,rows:[]});const n=g.get(k);n.meta+=r.orc;n.real+=r.real;if(r.com)n.com+=r.orc;n.rows.push(r);});
  return[...g.values()].filter(n=>Math.round(n.meta)||Math.round(n.real)).sort((a,b)=>String(a.k).localeCompare(String(b.k),'pt-BR'));
}

/* ===== Tabelas em árvore ===== */
function table(rows,keys,vOf,totV,tid){
  let h='<div class="table-scroll"><table><thead><tr><th class="left">Rótulos de Linha</th><th>Meta</th><th>Real</th><th>Desvio</th><th>Desvio %</th><th>ORÇ. % VGV</th><th>REAL. % VGV</th><th>Δ p.p.</th><th>Farol</th></tr></thead><tbody>';
  const line=(n,lvl,id,v,kids,cls)=>{
    const[o,r]=ratios(n,v),d=n.real-n.meta,dd=(o!=null&&r!=null)?r-o:null;
    return`<tr class="l${lvl}${kids?' tg':''}${cls||''}"${kids?` data-id="${esc(id)}"`:''}><td class="left" style="padding-left:${12+lvl*20}px">${kids?`<span class="tt">${S.exp.has(id)?'−':'+'}</span>`:''}${esc(n.k)}</td><td>${fmt(n.meta)}</td><td>${fmt(n.real)}</td><td class="${d>0?'neg':'pos'}">${fmt(d)}</td><td>${n.meta?pct(d/n.meta):'-'}</td><td>${pct(o,2)}</td><td>${pct(r,2)}</td><td>${dd==null?'-':(dd*100).toFixed(2).replace('.',',')}</td><td>${farol(dd)}</td></tr>`;};
  const walk=(rs,lvl,pid,v)=>{for(const n of build(rs,keys[lvl])){
    const id=pid+'|'+n.k,kids=lvl<keys.length-1,vv=lvl===0?vOf(n):v;
    h+=line(n,lvl,id,vv,kids);
    if(kids&&S.exp.has(id))walk(n.rows,lvl+1,id,vv);}};
  walk(rows,0,tid,null);
  h+=line(sum(rows,'Total Geral'),0,'',totV,false,' tot');
  return h+'</tbody></table></div>';
}
const pacKeys=[r=>r.pac,r=>r.sub];
const regKeys=[r=>r.reg,r=>r.pac,r=>r.sub];

function renderPeriod(mode){
  const idP=mode+'P',idR=mode+'R',fP=fget(idP),fR=fget(idR);
  const inM=f=>r=>mode==='mes'?r.mes===f.mes:r.mes<=f.mes;
  const per=f=>mode==='mes'?`MÊS DE ${MESES[f.mes-1]}`:`ACUMULADO (JANEIRO A ${MESES[f.mes-1]})`;
  const sel=S.ro.filter(inM(fP)).filter(inSet(fP.regs)),vP=vgvFor(fP.regs,msOf(mode,fP.mes));
  const tot=sum(sel),[o,r]=ratios(tot,vP),d=tot.real-tot.meta;
  const rowsR=S.ro.filter(inM(fR)).filter(inSet(fR.regs)),msR=msOf(mode,fR.mes);
  const regK=[x=>regKey(x,fR.regs),x=>x.pac,x=>x.sub];
  const kp=(l,x)=>`<div class="kpi"><div class="label">${l}</div><div class="value">${x}</div></div>`;
  const vl='VGV Real'+(fP.mes>S.vgvMax?' (até '+MESES[Math.max(S.vgvMax,1)-1].slice(0,3).toLowerCase()+')':'');
  $('p-'+mode).innerHTML=
   `<div class="kpi-row">${kp('Meta','R$ '+fmt(tot.meta))}${kp('Real','R$ '+fmt(tot.real))}${kp('Desvio','R$ '+fmt(d))}${kp('% Desvio',tot.meta?pct(d/tot.meta):'-')}${kp('ORÇ. % VGV',pct(o,2))}${kp('REAL. % VGV',pct(r,2))}${kp(vl,'R$ '+(vP?short(vP.R):'-'))}</div>
    <div class="panel"><h2>Despesas por pacote — ${per(fP)}</h2>${bar(idP)}${table(sel,pacKeys,()=>vP,vP,idP)}</div>
    <div class="panel"><h2>Despesas por regional — ${per(fR)}</h2>${bar(idR)}${table(rowsR,regK,n=>vgvFor(n.k==='SENSIA'?new Set(SEN):new Set([n.k]),msR),vgvFor(fR.regs,msR),idR)}</div>`;
}


const MS=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
function series(regs){
  const ok=inSet(regs);
  return Array.from({length:12},(_,i)=>{
    const m=i+1,n=sum(S.ro.filter(r=>r.mes===m&&ok(r))),v=vgvFor(regs,[m]),[o,r]=ratios(n,v);
    return{m,meta:n.meta,real:n.real,vm:v?v.M:null,vr:v?v.R:null,o,r};
  });
}
function lineChart(sr){
  const W=1000,H=300,L=30,R=30,T=40,B=36,iw=W-L-R,ih=H-T-B,vals=sr.flatMap(s=>[s.o,s.r]).filter(x=>x!=null);
  if(!vals.length)return'<div class="note">Sem VGV para esta regional.</div>';
  const mx=Math.max(...vals)*1.2||1,X=i=>L+iw*(i+.5)/12,Y=v=>T+ih*(1-v/mx);
  const path=k=>{let d='',pen=false;sr.forEach((s,i)=>{if(s[k]==null){pen=false;return;}d+=(pen?'L':'M')+X(i)+','+Y(s[k]);pen=true;});return d;};
  let g=`<line x1="${L}" x2="${W-R}" y1="${Y(0)}" y2="${Y(0)}" stroke="#ccc"/><path d="${path('o')}" fill="none" stroke="#9AA0A6" stroke-width="2.5" stroke-dasharray="7 5"/><path d="${path('r')}" fill="none" stroke="#5F6368" stroke-width="2.5"/>`;
  sr.forEach((s,i)=>{
    if(s.o!=null)g+=`<text x="${X(i)}" y="${Y(s.o)+17}" text-anchor="middle" font-size="11" fill="#80868B">${pct(s.o,2)}</text>`;
    if(s.r!=null){const t=pct(s.r,2),w=t.length*7+8,x=X(i);g+=`<circle cx="${x}" cy="${Y(s.r)}" r="3.5" fill="#5F6368"/><rect x="${x-w/2}" y="${Y(s.r)-28}" width="${w}" height="18" rx="2" fill="${s.o!=null&&s.r>s.o?'#E53935':'#1E9E5A'}"/><text x="${x}" y="${Y(s.r)-15}" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">${t}</text>`;}
    g+=`<text x="${X(i)}" y="${H-12}" text-anchor="middle" font-size="11" font-weight="700" fill="#80868B">${MS[i]}/26</text>`;
  });
  return`<svg viewBox="0 0 ${W} ${H}" width="100%">${g}</svg>`;
}
function barChart(sr){
  const W=1000,H=300,L=30,R=30,T=34,B=36,iw=W-L-R,ih=H-T-B,mx=Math.max(...sr.flatMap(s=>[s.meta,s.real]))*1.2||1,X=i=>L+iw*(i+.5)/12,Y=v=>T+ih*(1-v/mx),bw=iw/12*.6;
  let g=`<line x1="${L}" x2="${W-R}" y1="${Y(0)}" y2="${Y(0)}" stroke="#ccc"/>`,d='';
  sr.forEach((s,i)=>{
    if(s.real>0)g+=`<rect x="${X(i)-bw/2}" y="${Y(s.real)}" width="${bw}" height="${Y(0)-Y(s.real)}" fill="${s.real>s.meta?'#E53935':'#1E9E5A'}"/><text x="${X(i)}" y="${Y(0)-8}" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">${short(s.real)}</text>`;
    d+=(i?'L':'M')+X(i)+','+Y(s.meta);
  });
  g+=`<path d="${d}" fill="none" stroke="#7B7F85" stroke-width="2.5"/>`;
  sr.forEach((s,i)=>{g+=`<circle cx="${X(i)}" cy="${Y(s.meta)}" r="3" fill="#7B7F85"/><text x="${X(i)}" y="${Y(Math.max(s.meta,s.real))-8}" text-anchor="middle" font-size="11" font-weight="700" fill="#444">${short(s.meta)}</text><text x="${X(i)}" y="${H-12}" text-anchor="middle" font-size="11" font-weight="700" fill="#80868B">${MS[i]}/26</text>`;});
  return`<svg viewBox="0 0 ${W} ${H}" width="100%">${g}</svg>`;
}
function renderCharts(){
  const fl=id=>`<div class="filters" style="margin-bottom:10px">${msel(id)}</div>`;
  $('p-graf').innerHTML=`<div class="panel"><h2>Despesa / VGV por mês</h2>${fl('c1')}${lineChart(series(fget('c1').regs))}
    <div class="lg"><span><i class="ln"></i>Real</span><span><i class="ln ds"></i>Meta</span><span><i class="sq" style="background:#E53935"></i>Real acima da meta</span><span><i class="sq" style="background:#1E9E5A"></i>Real abaixo da meta</span></div></div>
    <div class="panel"><h2>Despesa real x meta por mês</h2>${fl('c2')}${barChart(series(fget('c2').regs))}
    <div class="lg"><span><i class="sq" style="background:#E53935"></i>Real acima da meta</span><span><i class="sq" style="background:#1E9E5A"></i>Real abaixo da meta</span><span><i class="ln" style="border-color:#7B7F85"></i>Meta</span></div></div>`;
}
const short=n=>{const a=Math.abs(n),f=(x,u)=>x.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+' '+u;return a>=1e9?f(n/1e9,'Bi'):a>=1e6?f(n/1e6,'M'):a>=1e3?f(n/1e3,'K'):fmt(n);};
function renderAll(){renderPeriod('mes');renderPeriod('acum');renderCharts();}

/* ===== Eventos ===== */
document.addEventListener('DOMContentLoaded',()=>{
  document.querySelectorAll('.tab-btn').forEach(b=>b.addEventListener('click',()=>{
    document.querySelectorAll('.tab-btn,.tab-content').forEach(e=>e.classList.remove('active'));
    b.classList.add('active');$(b.dataset.tab).classList.add('active');}));
  document.addEventListener('change',e=>{const t=e.target;
    if(t.dataset&&t.dataset.fm){fget(t.dataset.fm).mes=+t.value;renderAll();}
    else if(t.dataset&&t.dataset.reg){const f=fget(t.dataset.id);t.checked?f.regs.add(t.dataset.reg):f.regs.delete(t.dataset.reg);renderAll();}});
  document.addEventListener('click',e=>{const t=e.target,b=t.closest('[data-ms]'),c=t.closest('[data-clear]'),all=Object.values(F);
    if(c){fget(c.dataset.clear).regs.clear();renderAll();return;}
    if(b){const f=fget(b.dataset.ms),was=f.open;all.forEach(x=>x.open=false);f.open=!was;renderAll();return;}
    if(t.closest('.msp'))return;
    if(all.some(x=>x.open)){all.forEach(x=>x.open=false);renderAll();}});
  document.addEventListener('click',e=>{const tr=e.target.closest('tr.tg');if(!tr)return;
    const id=tr.dataset.id;S.exp.has(id)?S.exp.delete(id):S.exp.add(id);renderPeriod('mes');renderPeriod('acum');});
  $('fbFiles').addEventListener('change',async e=>{
    const b={};
    for(const f of e.target.files){const n=f.name.toLowerCase(),buf=await f.arrayBuffer();
      if(/param/.test(n))b.par=buf;else if(/vgv/.test(n))b.vgv=buf;else if(/or[cç]ado|real/.test(n))b.ro=buf;}
    if(!(b.ro&&b.par&&b.vgv)){$('fbMsg').textContent='Faltam arquivos: selecione os 3 de uma vez.';return;}
    try{ingest(b);}catch(err){$('fbMsg').textContent=String(err.message||err);}
  });
  load();
});
</script>
